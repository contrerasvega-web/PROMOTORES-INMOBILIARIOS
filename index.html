<style>
:root{
  --navy:#1f3a5f; --navy-2:#2b4c77; --ink:#1c2430; --muted:#667085; --line:#e4e7ec; --bg:#f6f7f9; --card:#fff;
  --red:#c62828; --red-bg:#fdecec; --green:#1b7f4b; --green-bg:#e7f5ed; --amber:#a15c00; --amber-bg:#fff4e0;
  --blue-bg:#e8f0fb; --yellow-bg:#fff8d6;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;padding:14px 0;white-space:nowrap}
header .brand small{display:block;font-weight:400;opacity:.75;font-size:11px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#cfd9e6;padding:16px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#f2c14e;font-weight:600}
main{max-width:1240px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 12px} h3{font-size:14px;margin:16px 0 8px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi .lbl{color:var(--muted);font-size:12px} .kpi .val{font-size:22px;font-weight:700;margin-top:4px} .kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:#f5f8fc}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd4dc;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8dc;border-color:var(--navy-2)}
.f{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.f{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid #cfd4dc;background:#fff;font:inherit;cursor:pointer;color:var(--ink);font-weight:500}
.btn:hover{background:#f3f5f8}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)} .btn.pri:hover{background:var(--navy-2)}
.btn.danger{color:var(--red);border-color:#f0b9b9}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#eef1f5;color:#475467}
.pill.g{background:var(--green-bg);color:var(--green)} .pill.r{background:var(--red-bg);color:var(--red)} .pill.a{background:var(--amber-bg);color:var(--amber)} .pill.b{background:var(--blue-bg);color:var(--navy)}
.note{padding:10px 12px;border-radius:8px;background:var(--blue-bg);color:var(--navy);margin:8px 0;font-size:13px}
.note.r{background:var(--red-bg);color:var(--red)} .note.g{background:var(--green-bg);color:var(--green)} .note.a{background:var(--amber-bg);color:var(--amber)}
.muted{color:var(--muted)} .right{text-align:right} .bold{font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:680px;width:100%;padding:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.copy{border-radius:10px;padding:12px;border:1px solid var(--line)}
.copy.BLANCA{background:#fff} .copy.AMARILLA{background:var(--yellow-bg)} .copy.AZUL{background:var(--blue-bg)}

<script>window.__API="https://script.google.com/macros/s/AKfycbxwm1v5-tAGA3D_D1ri09sSg4asXMGcY7ZDX81oYGzIxhzO_oNWJURjMgNM096MhAsjXQ/exec";</script>
<script>
"use strict";
// Adaptador versión Google (Apps Script): datos en Google Sheets, sincronización cada pocos segundos.
(function(){
  window.__LOCAL__ = true; window.__GAS__ = true;
  let TOK=null; try{ TOK=localStorage.getItem("erp_tok"); }catch(e){}
  const guardarTok=t=>{ TOK=t; try{ t?localStorage.setItem("erp_tok",t):localStorage.removeItem("erp_tok"); }catch(e){} };
  const falla=(e,mal)=>{ const m=(e&&e.message)||String(e); if(/SESION/.test(m)){ guardarTok(null); mostrarLogin(); } mal({code:"invalid_argument",message:m.replace(/^Error:\s*/,"")}); };
  const run=(fn,...a)=>new Promise((ok,mal)=>{
    if(window.__API){ const intento=n=>fetch(window.__API,{method:"POST",body:JSON.stringify({fn,args:a}),redirect:"follow",cache:"no-store"}).then(r=>r.json()).then(j=>{ if(j.ok) ok(j.r); else falla({message:j.error},mal); })
        .catch(e=>{ if(n<2) setTimeout(()=>intento(n+1),1500*(n+1)); else falla({message:"Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo."},mal); }); intento(0); return; }
    google.script.run.withSuccessHandler(ok).withFailureHandler(e=>falla(e,mal))[fn](...a); });
  const segs=p=>String(p).split("/").filter(Boolean), padre=p=>segs(p).slice(0,-1).join("/");
  const copia=o=>o==null?o:JSON.parse(JSON.stringify(o)); const meta={fromCache:false,hasPendingWrites:false};
  const snapDoc=(p,d)=>({id:segs(p).pop(),exists:d!=null,data:()=>copia(d)||undefined,metadata:meta});
  function fusionar(a,b){ const o={...(a||{})}; for(const [k,v] of Object.entries(b||{})){ if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) o[k]=fusionar(o[k],v); else o[k]=v; } return o; }

  // ----- caché local + suscripciones -----
  const cache=new Map(); let ts=0; const subsDoc=new Map(), subsCol=new Map();
  const notCol=new Set(); let tN=null;
  function notificar(p){ (subsDoc.get(p)||[]).forEach(f=>f(snapDoc(p,cache.get(p)))); notCol.add(padre(p)); clearTimeout(tN); tN=setTimeout(()=>{ notCol.forEach(c=>(subsCol.get(c)||[]).forEach(f=>f(snapCol(c)))); notCol.clear(); },40); }
  function snapCol(c){ const docs=[...cache.keys()].filter(k=>padre(k)===c).sort().map(k=>snapDoc(k,cache.get(k))); return {docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}; }
  let cargado=null;
  function cargar(){ if(!cargado) cargado=run("todo",TOK).then(j=>{ const r=JSON.parse(j); cache.clear(); Object.entries(r.docs).forEach(([k,v])=>cache.set(k,v)); ts=r.ts; setTimeout(sondear,4000); }); return cargado; }
  async function sondear(){ if(cola.length||enviando){ setTimeout(sondear,1500); return; }
    try{ const r=JSON.parse(await run("cambios",TOK,ts)); r.cambios.forEach(c=>{ if(c.d==null) cache.delete(c.p); else cache.set(c.p,c.d); notificar(c.p); }); ts=r.ts; }catch(e){}
    setTimeout(sondear,document.hidden?15000:4000); }
  // ----- cola de escritura (se aplica al instante en pantalla y se guarda en lotes) -----
  const cola=[]; let enviando=false, tE=null;
  function encolar(op){ cola.push(op); clearTimeout(tE); tE=setTimeout(vaciar,250); }
  async function vaciar(){ if(enviando||!cola.length) return; enviando=true; const lote=cola.splice(0,200);
    try{ const r=JSON.parse(await run("escribirVarios",TOK,JSON.stringify(lote))); if(r.ts>ts&&!cola.length) ts=Math.max(ts,r.ts-1); if(!r.ok) alerta("Algunos cambios no se guardaron: "+r.errores.join("; ")); }
    catch(e){ cola.unshift(...lote); alerta("Sin conexión: los cambios se guardarán cuando vuelva la conexión."); await new Promise(r=>setTimeout(r,5000)); }
    enviando=false; if(cola.length) vaciar(); }
  function alerta(m){ const t=document.getElementById("toast"); if(t) t.innerHTML=`<div class="toast">${m}</div>`; }
  window.addEventListener("beforeunload",e=>{ if(cola.length||enviando){ e.preventDefault(); e.returnValue=""; } });
  window.__pendientes=()=>cola.length+(enviando?1:0);

  function docRef(p){ return { id:segs(p).pop(), path:p,
    get: async()=>{ await cargado; if(p.startsWith("cfg/contador")||p.startsWith("ventas/")||p.startsWith("unidades/")){ while(cola.length||enviando) await new Promise(r=>setTimeout(r,200)); const r=JSON.parse(await run("leerDoc",TOK,p)); if(r.exists) cache.set(p,r.data); else cache.delete(p); }
      return snapDoc(p,cache.get(p)); },
    set: async(d)=>{ cache.set(p,copia(d)); notificar(p); encolar({op:"set",path:p,data:d}); },
    update: async(d)=>{ if(!cache.has(p)) throw {code:"invalid_argument",message:"No existe"}; cache.set(p,fusionar(cache.get(p),copia(d))); notificar(p); encolar({op:"update",path:p,data:d}); },
    delete: async()=>{ cache.delete(p); notificar(p); encolar({op:"delete",path:p}); },
    acquire: async(o)=>run("reservar",TOK,p,o.holder,o.ttlMs||30000),
    onSnapshot(next,err){ const l=subsDoc.get(p)||[]; l.push(next); subsDoc.set(p,l); cargar().then(()=>next(snapDoc(p,cache.get(p)))).catch(e=>err&&err(e)); return ()=>subsDoc.set(p,(subsDoc.get(p)||[]).filter(f=>f!==next)); },
    collection:c=>colRef(p+"/"+c) }; }
  function colRef(c){ const ref={ path:c, doc:id=>docRef(c+"/"+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,10)))),
    add: async d=>{ const r=ref.doc(); await r.set(d); return r; }, get: async()=>{ await cargar(); return snapCol(c); },
    onSnapshot(next,err){ const l=subsCol.get(c)||[]; l.push(next); subsCol.set(c,l); cargar().then(()=>next(snapCol(c))).catch(e=>err&&err(e)); return ()=>subsCol.set(c,(subsCol.get(c)||[]).filter(f=>f!==next)); },
    where(){return ref;}, orderBy(){return ref;}, limit(){return ref;} }; return ref; }
  const db={doc:docRef,collection:colRef};
  const downloads={ save: async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.target="_blank"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); return {status:"saved"}; } };
  const mcp={ callTool: async(server,tool,input)=>{ const r=await run("correo",TOK,{to:input.to,bcc:input.bcc,subject:input.subject,html:input.htmlBody||input.body,attachments:input.attachments||[]}); if(!r.ok) throw {code:"tool_error",message:r.error}; return {payload:r}; } };
  let yo=null; window.__yo=()=>yo;
  const user={ id: async()=>yo&&yo.u, can: async()=>true, canEdit: async()=>!!yo&&yo.rol==="admin" };
  // misma interfaz que la versión instalada para Configuración
  window.__api = async(url,opt={})=>{ const m=(opt.method||"GET").toUpperCase(), b=opt.body||{};
    if(url.startsWith("/api/correo-config")) return run("correoConfig",TOK,m,b);
    if(url.startsWith("/api/usuarios")) return run("usuarios",TOK,m,b);
    if(url.startsWith("/api/clave")) return run("cambiarClave",TOK,b);
    if(url.startsWith("/api/salir")) return run("salir",TOK);
    throw {message:"No disponible"}; };

  window.__od={ estado:()=>run("onedriveEstado",TOK), config:b=>run("onedriveConfig",TOK,b), url:()=>run("onedriveUrl",TOK), borrar:(pid,carpeta)=>run("onedriveBorrar",TOK,pid,carpeta),
    necesita:(pid,h)=>run("onedriveNecesita",TOK,pid,h), subir:(pid,h,nombre,b64)=>run("onedriveSubir",TOK,pid,h,nombre,b64) };
  let resolver; const listo=new Promise(r=>resolver=r);
  window.claude={ use: async n=>{ await listo; return ({db,downloads,mcp,user})[n]||null; } };

  // ----- pantalla de acceso -----
  const css="position:fixed;inset:0;background:#f6f7f9;display:flex;align-items:center;justify-content:center;z-index:50;font-family:Inter,system-ui,sans-serif";
  function caja(html){ let d=document.getElementById("__login"); if(!d){ d=document.createElement("div"); d.id="__login"; d.style.cssText=css; document.body.appendChild(d); } d.innerHTML=`<form style="background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:28px;width:360px;max-width:92vw">${html}<div id="__err" style="color:#c62828;font-size:13px;margin-top:8px"></div></form>`; return d.querySelector("form"); }
  const campo=(id,lab,t="text")=>`<label style="display:block;font-size:12px;color:#667085;margin:10px 0 4px">${lab}</label><input id="${id}" type="${t}" style="width:100%;padding:9px 10px;border:1px solid #cfd4dc;border-radius:7px;font:inherit;box-sizing:border-box" required>`;
  const boton=t=>`<button style="margin-top:16px;width:100%;padding:10px;border:0;border-radius:7px;background:#1f3a5f;color:#fff;font:inherit;font-weight:600;cursor:pointer">${t}</button>`;
  const ocupado=(f,s)=>{ const b=f.querySelector("button"); b.disabled=s; b.style.opacity=s?.6:1; };
  function mostrarLogin(){ const f=caja(`<div style="font-weight:700;font-size:18px;color:#1f3a5f">ERP Inmobiliario</div><div style="color:#667085;font-size:13px;margin-bottom:6px">Contreras Vega · Inicia sesión</div>${campo("__u","Usuario")}${campo("__c","Contraseña","password")}${boton("Entrar")}`);
    f.onsubmit=async e=>{ e.preventDefault(); ocupado(f,true); try{ const r=await run("entrar",f.querySelector("#__u").value,f.querySelector("#__c").value); despues(r); }catch(x){ ocupado(f,false); f.querySelector("#__err").textContent=x.message; } }; }
  function mostrarConfigurar(){ const f=caja(`<div style="font-weight:700;font-size:18px;color:#1f3a5f">Bienvenido</div><div style="color:#667085;font-size:13px;margin-bottom:6px">Crea el usuario administrador. Con él podrás crear los usuarios de tus compañeros.</div>${campo("__n","Tu nombre")}${campo("__u","Usuario (sin espacios)")}${campo("__c","Contraseña (mínimo 6)","password")}${boton("Crear y entrar")}`);
    f.onsubmit=async e=>{ e.preventDefault(); ocupado(f,true); try{ const r=await run("configurar",f.querySelector("#__n").value,f.querySelector("#__u").value,f.querySelector("#__c").value); despues(r); }catch(x){ ocupado(f,false); f.querySelector("#__err").textContent=x.message; } }; }
  function barra(){ const h=document.querySelector("header"); if(!h||document.getElementById("__yo")) return; const d=document.createElement("div"); d.id="__yo"; d.style.cssText="margin-left:auto;color:#cfd9e6;font-size:13px;white-space:nowrap";
    d.innerHTML=`${yo.nombre} · <a href="#" style="color:#fff">Salir</a>`; d.querySelector("a").onclick=async e=>{ e.preventDefault(); if(window.__pendientes()) { alerta("Espera un momento: se están guardando cambios."); return; } await run("salir",TOK).catch(()=>{}); guardarTok(null); yo=null; d.remove(); mostrarLogin(); }; h.appendChild(d); }
  function despues(r){ guardarTok(r.token); const l=document.getElementById("__login"); if(l) l.remove(); iniciar(); }
  async function iniciar(){ try{ const r=await run("estado",TOK); if(r.configurar){ mostrarConfigurar(); return; } if(!r.usuario){ mostrarLogin(); return; } yo=r.usuario; await cargar(); resolver(); barra(); const l=document.getElementById("__login"); if(l) l.remove(); }
    catch(e){ caja(`<b>No se pudo conectar.</b><p style="color:#667085;font-size:13px">${e.message||""} Reintentando…</p>`); setTimeout(iniciar,4000); } }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",iniciar); else iniciar();
})();

</script>
<script>
"use strict";
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtNum = new Intl.NumberFormat("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
const $$ = c => "$" + fmtNum.format((c||0)/100);           // cents -> "$1.000,00"
const hoy = () => new Date().toLocaleDateString("en-CA");    // YYYY-MM-DD local
const col = new Intl.Collator("es",{numeric:true,sensitivity:"base"});
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const pad = (n,w=7) => String(n).padStart(w,"0");
function parseMoney(s){
  if(typeof s==="number") return Math.round(s*100);
  s=String(s||"").replace(/[\s$]/g,""); if(!s) return 0;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>-1 && ld>-1){ s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>-1){ s=s.replace(/\./g,"").replace(",","."); }
  else if(ld>-1 && /^\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,""); }
  const n=Number(s); return isFinite(n)? Math.round(n*100) : NaN;
}
const money2in = c => c ? (c/100).toFixed(2) : "";
function addMonths(str,m){
  const [y,mo,d]=str.split("-").map(Number); const t=new Date(y,mo-1+m,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)).toLocaleDateString("en-CA");
}
const fechaLarga = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return `${d} de ${MESES[m-1]} de ${y}`; };
const fechaCorta = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const diasEntre = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=="object") a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function toast(msg,ms=3500){ const t=$("#toast"); t.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",ms); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* Número en letras (español) */
function letras(n){
  const U=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE"];
  const E=["DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE"];
  const V=["VEINTE","VEINTIUNO","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
  const D=["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const dec=x=> x<10?U[x]: x<20?E[x-10]: x<30?V[x-20]: D[Math.floor(x/10)]+(x%10?" Y "+U[x%10]:"");
  const cen=x=> x===100?"CIEN": (C[Math.floor(x/100)]+(x%100?" "+dec(x%100):"")).trim();
  const apoc=s=> s.replace(/VEINTIUNO$/,"VEINTIÚN").replace(/UNO$/,"UN");
  if(n===0) return "CERO";
  let out=[]; const mill=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), r=n%1000;
  if(mill) out.push(mill===1?"UN MILLÓN": apoc(cen(mill))+" MILLONES");
  if(mil) out.push(mil===1?"MIL": apoc(cen(mil))+" MIL");
  if(r) out.push(cen(r));
  return out.join(" ").replace(/\s+/g," ").trim();
}
const montoLetras = c => `${letras(Math.floor(c/100))} CON ${String(c%100).padStart(2,"0")}/100 DÓLARES`;

/* Cédula ecuatoriana (módulo 10) */
function cedulaValida(c){
  if(!/^\d{10}$/.test(c)) return false;
  const prov=+c.slice(0,2); if(prov<1||(prov>24&&prov!==30)) return false;
  if(+c[2]>5) return false;
  let s=0; for(let i=0;i<9;i++){ let v=+c[i]*(i%2?1:2); if(v>9) v-=9; s+=v; }
  return ((10-(s%10))%10)===+c[9];
}

/* ================= Lógica de negocio ================= */
const TIPOS = {RESERVA:"Reserva",ENTRADA:"Entrada",CREDITO:"Crédito"};
const ORDEN = {RESERVA:1,ENTRADA:2,CREDITO:3};
function dividir(total,n){ const base=Math.floor(total/n); const a=Array(n).fill(base); a[n-1]=total-base*(n-1); return a; }
function calcPlan(p){
  const errs=[]; const precio=p.precio|0;
  const pr=Number(p.pctReserva), pe=Number(p.pctEntrada), meses=parseInt(p.meses,10), ne=Math.max(1,parseInt(p.cuotasEntrada||1,10));
  if(!(precio>0)) errs.push("El precio debe ser mayor a 0.");
  if(!(pr>=0&&pe>=0&&pr+pe<=100)) errs.push("Porcentajes fuera de rango.");
  if(!(meses>=1&&meses<=60)) errs.push("Los meses de reserva deben estar entre 1 y 60.");
  if(!p.fechaInicio) errs.push("Falta la fecha de la primera cuota de reserva.");
  if(!p.fechaCredito) errs.push("Falta la fecha estimada del crédito.");
  if(errs.length) return {errs,cuotas:[]};
  const mR=Math.round(precio*pr/100), mE=Math.round(precio*pe/100), mC=precio-mR-mE;
  const cuotas=[];
  dividir(mR,meses).forEach((m,i)=>cuotas.push({k:"R"+(i+1),tipo:"RESERVA",n:i+1,fecha:addMonths(p.fechaInicio,i),monto:m,pagado:0}));
  if(mE>0) dividir(mE,ne).forEach((m,i)=>cuotas.push({k:"E"+(i+1),tipo:"ENTRADA",n:i+1,fecha:addMonths(p.fechaEntrada||addMonths(p.fechaInicio,meses),i),monto:m,pagado:0}));
  cuotas.push({k:"C1",tipo:"CREDITO",n:1,fecha:p.fechaCredito,monto:mC,pagado:0});
  const ultR=cuotas.filter(c=>c.tipo==="RESERVA").pop();
  if(ultR && ultR.fecha>p.fechaCredito) errs.push(`La última cuota de reserva (${fechaCorta(ultR.fecha)}) queda después de la fecha del crédito (${fechaCorta(p.fechaCredito)}). La reserva debe completarse antes del crédito.`);
  const suma=cuotas.reduce((s,c)=>s+c.monto,0);
  if(suma!==precio) errs.push("Descuadre interno del plan.");
  return {errs,cuotas,mR,mE,mC,pctC:100-pr-pe};
}
function ordenarCuotas(cs){ return [...cs].sort((a,b)=>ORDEN[a.tipo]-ORDEN[b.tipo]||a.fecha.localeCompare(b.fecha)||a.n-b.n); }
function imputar(cuotas,monto){
  const pend=ordenarCuotas(cuotas).filter(c=>c.pagado<c.monto);
  const saldo=pend.reduce((s,c)=>s+c.monto-c.pagado,0);
  if(monto>saldo) return {err:`El pago (${$$(monto)}) supera el saldo pendiente (${$$(saldo)}).`};
  let r=monto; const apps=[];
  for(const c of pend){ if(r<=0) break; const a=Math.min(r,c.monto-c.pagado); apps.push({k:c.k,monto:a}); r-=a; }
  return {apps,saldoDespues:saldo-monto};
}
const saldoTipo = (v,t) => (v.cuotas||[]).filter(c=>c.tipo===t).reduce((s,c)=>s+c.monto-c.pagado,0);
const saldoVenta = v => (v.cuotas||[]).reduce((s,c)=>s+c.monto-c.pagado,0);
const pagadoVenta = v => (v.cuotas||[]).reduce((s,c)=>s+c.pagado,0);
function estadoCuota(c){ if(c.pagado>=c.monto) return ["Pagada","g"]; if(c.fecha<hoy()) return [`Atrasada ${diasEntre(c.fecha,hoy())} d`,"r"]; if(c.pagado>0) return ["Parcial","a"]; return ["Por vencer",""]; }
function recalcularReserva(cuotas,modo,base){
  const ab=cuotas.filter(c=>c.tipo==="RESERVA"&&c.pagado<c.monto).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const saldo=ab.reduce((s,c)=>s+c.monto-c.pagado,0); const nuevo={};
  if(!ab.length) return nuevo;
  if(modo==="MISMO_PLAZO"){ dividir(saldo,ab.length).forEach((p,i)=>nuevo[ab[i].k]=ab[i].pagado+p); }
  else { let r=saldo; ab.forEach(c=>{ const p=Math.min(r,Math.max(0,base-c.pagado)); r-=p; nuevo[c.k]=c.pagado+p; }); if(r>0){ const u=ab[ab.length-1]; nuevo[u.k]+=r; } }
  return nuevo;
}

function chartFlujo(meses,real,proy,mesAct){
  const W=1160,H=260,pl=70,pb=34,pt=14; const cw=(W-pl-10)/meses.length;
  const tot=meses.map(m=> m<mesAct?(real[m]||0): m===mesAct? Math.max(real[m]||0, 0)+(proy[m]?Object.values(proy[m]).reduce((a,b)=>a+b,0):0) : (proy[m]?Object.values(proy[m]).reduce((a,b)=>a+b,0):0));
  const max=Math.max(1,...tot); const step=niceStep(max/4); const top=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=""; for(let v=0;v<=top;v+=step){ g+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#667085">${v>=1e8?"$"+(v/1e8).toFixed(1)+"M":"$"+fmtNum.format(v/100).replace(/,00$/,"")}</text>`; }
  const colors={REAL:"#1f3a5f",RESERVA:"#f2c14e",ENTRADA:"#6aa3d9",CREDITO:"#b7c7dc"};
  let bars="";
  meses.forEach((m,i)=>{ const x=pl+i*cw+cw*0.18, w=cw*0.64; let base=0;
    const segs=[]; if(m<=mesAct&&real[m]) segs.push(["REAL",real[m]]);
    if(m>=mesAct&&proy[m]) ["RESERVA","ENTRADA","CREDITO"].forEach(t=>{ if(proy[m][t]) segs.push([t,proy[m][t]]); });
    segs.forEach(([t,v])=>{ const y1=y(base+v), y0=y(base); bars+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" fill="${colors[t]}" rx="2"><title>${m} · ${t==="REAL"?"Cobrado":"Proyectado "+TIPOS[t]}: ${$$(v)}</title></rect>`; base+=v; });
    const [yy,mm]=m.split("-"); bars+=`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle" font-size="11" fill="${m===mesAct?"#1c2430":"#667085"}" font-weight="${m===mesAct?700:400}">${MESES[+mm-1].slice(0,3)} ${yy.slice(2)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Flujo de caja mensual">${g}${bars}</svg>
  <div class="legend"><span><i style="background:${colors.REAL}"></i>Cobrado</span><span><i style="background:${colors.RESERVA}"></i>Proyectado reserva</span><span><i style="background:${colors.ENTRADA}"></i>Proyectado entrada</span><span><i style="background:${colors.CREDITO}"></i>Proyectado crédito</span><span>Lo vencido sin pagar se muestra en el mes actual.</span></div>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

    ${tablaCuotas(v,true)}</div>

    <div class="row"><div class="f"><label>Fecha</label>${inp("caja.fecha",'type="date"')}</div><div class="f"><label>Monto (USD)</label>${inp("caja.monto",'inputmode="decimal" placeholder="1.000,00"')}</div></div>

function tablaCuotas(v,compact){
  const cs=ordenarCuotas(v.cuotas||[]);
  return `<table style="margin-top:12px"><tr><th>Cuota</th><th>Vence</th><th class="n">Monto</th><th class="n">Pagado</th><th class="n">Pendiente</th><th>Estado</th></tr>${cs.map(c=>{const [t,k]=estadoCuota(c); return `<tr><td>${TIPOS[c.tipo]} ${c.tipo==="CREDITO"?"hipotecario":c.n}</td><td>${fechaCorta(c.fecha)}</td><td class="n">${$$(c.monto)}</td><td class="n">${$$(c.pagado)}</td><td class="n">${$$(c.monto-c.pagado)}</td><td><span class="pill ${k}">${t}</span></td></tr>`;}).join("")}</table>`;
}
function cajaCalc(){
  const st=S.ui.caja; const v=byId("ventas",st.ventaId); if(!v) return {err:"Selecciona una venta."};
  const p=byId("proyectos",v.proyectoId)||{};
  const monto=parseMoney(st.monto);
  if(!st.monto) return {err:"Ingresa el monto."};
  if(!(monto>0)) return {err:"Monto no válido."};
  if(!st.fecha) return {err:"Ingresa la fecha."};
  if(st.forma==="DESEMBOLSO"&&saldoTipo(v,"RESERVA")>0) return {err:`No se puede registrar el desembolso: la reserva tiene un saldo pendiente de ${$$(saldoTipo(v,"RESERVA"))}. Debe pagarse completa antes del crédito hipotecario.`};
  if(["TRANSFERENCIA","DEPOSITO","CHEQUE"].includes(st.forma)&&!st.referencia) return {err:`Falta el ${st.forma==="CHEQUE"?"número de cheque":"número de documento"}.`};
  if(!st.recibeNombre) return {err:"Falta el nombre de quien recibe (Recibí conforme)."};
  const r=imputar(v.cuotas||[],monto); if(r.err) return r;
  const conc= st.concepto || conceptoAuto(v,r.apps,p);
  return {v,p,monto,apps:r.apps,saldoDespues:r.saldoDespues,concepto:conc};
}
function conceptoAuto(v,apps,p){
  const cs=Object.fromEntries((v.cuotas||[]).map(c=>[c.k,c])); const nR=(v.cuotas||[]).filter(c=>c.tipo==="RESERVA").length;
  const partes=apps.map(a=>{const c=cs[a.k]; const parcial=a.monto<c.monto-c.pagado; return c.tipo==="RESERVA"?`cuota ${c.n}/${nR} de reserva${parcial?" (parcial)":""}`: c.tipo==="ENTRADA"?`entrada${parcial?" (parcial)":""}`:`crédito hipotecario${parcial?" (abono)":""}`;});
  return `Abono ${partes.join(", ")} - ${p.nombre||""} ${ventaUnidadesTxt(v)}`;
}
function updCajaPreview(){
  const el=$("#cajaPrev"); if(!el) return; const r=cajaCalc();
  if(r.err){ el.innerHTML=`<div class="note ${S.ui.caja.monto?"r":""}">${esc(r.err)}</div>`; return; }
  const cs=Object.fromEntries(r.v.cuotas.map(c=>[c.k,c]));
  el.innerHTML=`<table><tr><th>Se aplica a</th><th class="n">Monto</th></tr>${r.apps.map(a=>`<tr><td>${TIPOS[cs[a.k].tipo]} ${cs[a.k].tipo==="CREDITO"?"":cs[a.k].n}</td><td class="n">${$$(a.monto)}</td></tr>`).join("")}</table>
   <div class="f" style="margin-top:10px"><label>Valor en letras</label><b>${esc(montoLetras(r.monto))}</b></div>
   <div class="f"><label>Concepto</label>${esc(r.concepto)}</div>
   <div class="f"><label>Saldo pendiente después del abono</label><b>${$$(r.saldoDespues)}</b></div>
   <div class="f"><label>Se enviará a</label>${esc(byId("clientes",r.v.clienteId)?.email||"(cliente sin correo)")}</div>
   ${S.canEdit?`<button class="btn pri" data-act="emitir" ${S.ui.emitiendo?"disabled":""}>${S.ui.emitiendo?"Emitiendo…":`Emitir comprobante N° ${pad(numSiguiente())}`}</button>`:`<div class="note a">Tu acceso es de solo lectura.</div>`}`;

const provCorreo = () => window.__LOCAL__ ? (S.smtp&&S.smtp.configurado?"SMTP":"ninguno") : (S.cfg.proveedorCorreo||"ninguno");
const numSiguiente = () => S.contador?.siguiente || Number(S.cfg.numeroInicial) || 6233;

async function reservarNumero(){
  const ref=S.db.doc("cfg/contador"); const holder=S.uid||("tab-"+uid());
  for(let i=0;i<8;i++){
    let r; try{ r=await ref.acquire({holder,ttlMs:8000}); }catch(e){ if(e&&e.code==="unavailable"&&i<7){ await new Promise(res=>setTimeout(res,800)); continue; } r={acquired:true}; }
    if(r.acquired){ const s=await ref.get(); const n=(s.exists&&s.data().siguiente)||Number(S.cfg.numeroInicial)||6233;
      await ref.set({...(s.exists?s.data():{}),siguiente:n+1}); return n; }
    await new Promise(res=>setTimeout(res,700+Math.random()*600));
  }
  throw new Error("Otro usuario está emitiendo un comprobante. Intenta de nuevo en unos segundos.");
}
function documentoTxt(p,forma,ref){
  if(p.fideicomiso) return "Transferencia Fideicomiso"+(ref?" "+ref:"");
  const F={TRANSFERENCIA:"Transferencia",DEPOSITO:"Depósito",TARJETA:"Tarjeta",DESEMBOLSO:"Desembolso crédito"}[forma];
  return F? `${F}${ref?" "+ref:""}` : "";
}
async function emitir(){
  if(S.ui.emitiendo) return; const r=cajaCalc(); if(r.err){ toast(r.err); return; }
  S.ui.emitiendo=true; render();
  try{
    const st=S.ui.caja; const v=r.v, p=r.p, c=byId("clientes",v.clienteId)||{};
    // releer la venta para trabajar con datos actuales
    const vs=await S.db.doc("ventas/"+v.id).get(); const vAct={id:v.id,...vs.data()};
    const r2=imputar(vAct.cuotas,r.monto); if(r2.err) throw new Error(r2.err);
    const numero=await reservarNumero();
    const pagoId=uid();
    const cuotas=vAct.cuotas.map(q=>{ const a=r2.apps.find(x=>x.k===q.k); return a?{...q,pagado:q.pagado+a.monto}:q; });
    const pago={ventaId:v.id,fecha:st.fecha,monto:r.monto,forma:st.forma,banco:st.banco||"",referencia:st.referencia||"",concepto:r.concepto,aplicaciones:r2.apps,comprobante:numero,anulado:false,creadoEn:new Date().toISOString(),creadoPor:S.uid||""};
    await S.db.doc("pagos/"+pagoId).set(pago);
    await S.db.doc("ventas/"+v.id).update({cuotas});
    const comp={numero,pagoId,ventaId:v.id,proyectoId:p.id,fecha:st.fecha,valor:r.monto,letras:montoLetras(r.monto),saldoDespues:r2.saldoDespues,concepto:r.concepto,
      cliente:{nombre:`${c.nombres||""} ${c.apellidos||""}`.trim(),identificacion:c.identificacion||"",email:c.email||""},
      proyecto:p.nombre||"",fideicomiso:!!p.fideicomiso,unidad:ventaUnidadesTxt(v),forma:st.forma,
      documento:documentoTxt(p,st.forma,st.forma==="CHEQUE"?"":st.referencia),cheque:st.forma==="CHEQUE"?st.referencia:"",banco:st.banco||"",efectivo:st.forma==="EFECTIVO"?r.monto:0,
      recibe:{nombre:st.recibeNombre||"",ci:st.recibeCI||""},estado:"EMITIDO",copias:{BLANCA:{},AMARILLA:{},AZUL:{}},correo:{estado:"PENDIENTE"},creadoEn:new Date().toISOString()};
    await S.db.doc("comprobantes/"+numero).set(comp);
    if(S.uid && (st.recibeNombre!==S.perfil.nombre||st.recibeCI!==S.perfil.ci)) S.db.doc(`data/users/${S.uid}/perfil`).set({nombre:st.recibeNombre,ci:st.recibeCI||""}).catch(()=>{});
    S.ui.caja={ultimo:numero}; toast(`Comprobante N° ${pad(numero)} emitido.`);
  }catch(e){ toast("No se pudo emitir: "+(e.message||e.code)); }
  S.ui.emitiendo=false; render();
}

function lineasBalanceadas(doc,txt,maxW){
  const w=txt.split(/\s+/); if(doc.getTextWidth(txt)<=maxW*0.75||w.length<3) return doc.splitTextToSize(txt,maxW);
  let best=null; for(let i=1;i<w.length;i++){ const a=w.slice(0,i).join(" "), b=w.slice(i).join(" "); const m=Math.max(doc.getTextWidth(a),doc.getTextWidth(b)); if(m<=maxW&&(!best||m<best[0])) best=[m,[a,b]]; }
  return best?best[1]:doc.splitTextToSize(txt,maxW);
}

function pdfComprobante(c,modo,cc){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a5",orientation:"portrait"});
  if(modo==="FISICO"){ dibujarFisico(doc,c,cc); doc.setProperties({title:`Comprobante ${pad(c.numero)} (para talonario)`}); return doc; }
  const cs= modo==="TRIPLICADO"? COPIAS : COPIAS.filter(x=>x.k===modo);
  cs.forEach((cp,i)=>{ if(i) doc.addPage("a5","portrait"); dibujarComprobante(doc,c,cp,cc); });
  doc.setProperties({title:`Comprobante ${pad(c.numero)}`});
  return doc;
}
async function descargarPdf(n,modo){
  const c=byId("comprobantes",String(n)); if(!c) return;
  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF. Recarga la página."); return; }
  if(!S.dl){ toast("La descarga de archivos no está disponible en esta vista."); return; }
  const doc=pdfComprobante(c,modo); const buf=doc.output("arraybuffer");
  try{ await S.dl.save({filename:`Comprobante_${pad(c.numero)}${modo==="FISICO"?"_para_imprimir":"_cliente"}.pdf`,data:buf}); if(modo==="FISICO") toast("Imprime el PDF en tamaño real (100 %), en el comprobante físico N° "+pad(c.numero)+".",8000); }
  catch(e){ if(e.code!=="declined") toast("No se pudo descargar: "+e.code); }
}

/* ---------- Correo ---------- */
function correoHtml(c,cc){
  const cfg=S.cfg; cc=cc||compCfg(); const r=(k,v)=>`<tr><td style="padding:6px 10px;color:#667085;border-bottom:1px solid #eee">${k}</td><td style="padding:6px 10px;border-bottom:1px solid #eee"><b>${esc(v)}</b></td></tr>`;
  const par=t=>esc(plantilla(t,c)).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
  return `${par(cc.mensaje)}
  ${cc.tabla==="0"?"":`<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px">${r("Comprobante N°",pad(c.numero))}${r("Fecha",fechaLarga(c.fecha))}${r("Valor",$$(c.valor))}${r("La suma de",c.letras)}${r("Concepto",c.concepto)}${r("Proyecto / Unidad",`${c.proyecto} - ${c.unidad}`)}${c.documento?r("Documento N°",c.documento):""}${cc.ver.saldo!=="0"?r("Saldo pendiente",$$(c.saldoDespues)):""}</table>`}
  ${par(cc.despedida)}<p>${esc(cfg.nombre||"")}<br>${esc(cfg.direccion||"")}<br>${esc(cfg.email||"")} ${esc(cfg.web||"")}</p>`;
}
async function enviarCorreo(n){
  const c=byId("comprobantes",String(n)); if(!c) return;
  const prov=provCorreo();
  if(prov==="ninguno"){ toast("Configura primero el correo de envío en Configuración."); return; }
  if(!S.mcp){ toast("El envío de correo no está disponible en esta vista. Abre la app desde claude.ai."); return; }
  const ref=S.db.doc("comprobantes/"+c.id);
  await ref.update({correo:{estado:"ENVIANDO"}});
  const subject=plantilla(compCfg().asunto,c).trim()||`Comprobante de pago N° ${pad(c.numero)}`;
  const bcc=(S.cfg.correoContabilidad||"").split(/[,;\s]+/).filter(Boolean);
  try{
    if(prov==="Gmail"||prov==="SMTP"){
      const b64=pdfComprobante(c,"AMARILLA").output("datauristring").split(",")[1];
      await S.mcp.callTool(prov==="SMTP"?"SMTP":"Gmail","send_message",{to:[c.cliente.email],bcc,subject,htmlBody:correoHtml(c),attachments:[{content:b64,filename:`Comprobante_${pad(c.numero)}.pdf`,mimeType:"application/pdf"}]});
    } else {
      await S.mcp.callTool("Microsoft 365","outlook_send_mail",{to:[c.cliente.email],bcc,subject,body:correoHtml(c),bodyType:"html"});
    }
    await ref.update({correo:{estado:"ENVIADO",en:new Date().toISOString(),via:prov,error:null}});
    toast("Correo enviado a "+c.cliente.email);
  }catch(e){
    const msgs={needs_reauth:`Vuelve a conectar ${prov} en claude.ai → Configuración → Conectores.`,server_not_connected:`Agrega el conector ${prov} en claude.ai → Configuración → Conectores.`,approval_required:"Debes aprobar el envío cuando Claude lo pida.",not_in_manifest:`El envío por ${prov} no está permitido para esta página.`,selection_required:`Elige cuál conector de ${prov} usar cuando Claude lo pregunte.`};
    const m=msgs[e.code]|| (e.code==="server_unavailable"||e.code==="upstream_error"? "No hubo respuesta del servicio de correo; revisa en la bandeja de enviados antes de reenviar." : (e.message||e.code||"Error desconocido"));
    await ref.update({correo:{estado:"FALLIDO",en:new Date().toISOString(),error:m}}).catch(()=>{});
    toast("No se pudo enviar: "+m,6000);
  }
}

function ventaCalc(){
  const n=S.ui.venta.n; const errs=[];
  if(!n.clienteId) errs.push("Selecciona el cliente.");
  const p=byId("proyectos",n.proyectoId); if(!p) errs.push("Selecciona el proyecto.");
  const princ=byId("unidades",n.unidadId); if(p&&!princ) errs.push("Selecciona la unidad.");
  if(princ&&!esPrincipal(princ)&&!n.asignadoA) errs.push("Indica a qué departamento queda asignado.");
  const unidades=[]; if(princ) unidades.push({id:princ.id,precio:parseMoney(getPath(S.ui,"venta.n.precios."+princ.id))});
  if(princ&&esPrincipal(princ)) Object.entries(n.extras||{}).forEach(([id,on])=>{ if(on==="1"&&byId("unidades",id)) unidades.push({id,precio:parseMoney(getPath(S.ui,"venta.n.precios."+id))}); });
  if(unidades.some(u=>!(u.precio>=0)||isNaN(u.precio))) errs.push("Revisa los precios.");
  const precio=unidades.reduce((s,u)=>s+(u.precio||0),0);
  const plan={precio,pctReserva:String(n.pctReserva).replace(",","."),pctEntrada:String(n.pctEntrada).replace(",","."),meses:n.meses,cuotasEntrada:n.cuotasEntrada,fechaInicio:n.fechaInicio,fechaEntrada:n.fechaEntrada,fechaCredito:n.fechaCredito};
  const r=precio>0?calcPlan(plan):{errs:[],cuotas:[]};
  return {errs:[...errs,...r.errs],r,unidades,precio,plan,p,princ};
}

async function anular(){

  const c=byId("comprobantes",String(m.n)); const pago=byId("pagos",c.pagoId); const vs=await S.db.doc("ventas/"+c.ventaId).get(); const v=vs.data();
  const cuotas=v.cuotas.map(q=>{ const a=(pago?.aplicaciones||[]).find(x=>x.k===q.k); return a?{...q,pagado:Math.max(0,q.pagado-a.monto)}:q; });

/* ---------- Importar cartera desde Excel ---------- */
function xv(c){ let v=c?c.value:null; if(v&&typeof v==="object"&&!(v instanceof Date)){ if("result" in v) v=v.result; else if(v.richText) v=v.richText.map(t=>t.text).join(""); else if(v.text) v=v.text; else if(v.error) v=null; } return v; }
function xnum(v){ if(v==null||v==="") return 0; if(typeof v==="number") return v; const n=parseMoney(String(v)); return isNaN(n)?0:n/100; }
function xfecha(v){ if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==="number"&&v>20000&&v<80000){ return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10); } return ""; }
const xtxt = v => v==null? "" : (v instanceof Date? xfecha(v) : String(v).trim());
const claveUnidad = s => String(s||"").toUpperCase().replace(/\s+/g,"");
function partirUnidad(s){ s=String(s||"").trim().toUpperCase().replace(/\s+/g," ");
  let m=s.match(/^LOCAL\s*(.+)$/); if(m) return {tipo:"LOCAL",etapa:"",numero:m[1].trim()};
  m=s.match(/^([A-Z]+)\s*(\d+[A-Z0-9-]*)$/); if(m) return {tipo:"DEPARTAMENTO",etapa:m[1],numero:m[2]};
  return {tipo:"DEPARTAMENTO",etapa:"",numero:s}; }
function partirNombre(n){ const w=String(n||"").trim().replace(/\s+/g," ").split(" "); if(w.length<=2) return {nombres:w[0]||"",apellidos:w[1]||""}; return {nombres:w.slice(0,2).join(" "),apellidos:w.slice(2).join(" ")}; }
function filaCabecera(ws,test){ for(let r=1;r<=Math.min(ws.rowCount,30);r++){ const vals=[]; ws.getRow(r).eachCell({includeEmpty:false},(c,i)=>vals[i]=xv(c)); if(test(vals)) return {r,vals}; } return null; }
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();

function leerCartera(wb){
  const avisos=[]; const hojas=wb.worksheets;
  const wsC=hojas.find(w=>/cartera/i.test(w.name))||hojas[0];
  const wsF=hojas.find(w=>/flujo/i.test(w.name));
  const wsR=hojas.find(w=>/reserva/i.test(w.name));
  const hc=filaCabecera(wsC,v=>v.some(x=>norm(x)==="cliente"));
  if(!hc) throw new Error(`No encontré la fila de títulos (con "Cliente") en la hoja ${wsC.name}.`);
  const col={}, meses=[];
  hc.vals.forEach((x,i)=>{ if(x instanceof Date){ meses.push({i,mes:xfecha(x).slice(0,7)}); return; } const h=norm(x); if(!h) return;
    const set=(k)=>{ if(col[k]==null) col[k]=i; };
    if(h==="cliente") set("cliente"); else if(h.includes("unidad")) set("unidad"); else if(h.includes("vendedor")) set("vendedor"); else if(h.includes("uaf")) set("uafe");
    else if(h.includes("entrega")) set("entregaPICV"); else if(h.includes("deposito")) set("deposito"); else if(h.includes("firma")) set("firma");
    else if(h.includes("vendid")) set("areaVendida"); else if(h.includes("definitiv")) set("areaDefinitiva"); else if(h.includes("plano")) set("plano");
    else if(h.includes("balcon")) set(h.includes("valor")?"vBalcon":"areaBalcon"); else if(h.includes("patio")) set(h.includes("valor")?"vPatio":"areaPatio"); else if(h.includes("plaza")) set(h.includes("valor")?"vPlaza":"areaPlaza");
    else if(h.includes("valor m2")||h==="valor m²") set("valorM2");
    else if(h.includes("precio")&&h.includes("parq")) set("pParq"); else if(h.includes("parq")) set("nParq");
    else if(h.includes("precio")&&h.includes("bod")) set("pBod"); else if(h.includes("bodega")) set("nBod");
    else if(h.includes("valor total")) set("total"); else if(h.includes("por abonar")) set("porAbonar"); else if(h.includes("abonado")) set("abonado"); });
  if(col.cliente==null||col.unidad==null) throw new Error("Faltan las columnas Cliente o Unidad.");
  const items=[];
  for(let r=hc.r+1;r<=wsC.rowCount;r++){ const row=wsC.getRow(r); const g=k=>col[k]==null?null:xv(row.getCell(col[k]));
    const cli=xtxt(g("cliente")), un=xtxt(g("unidad")); if(!cli||!un) continue;
    const mesesPag={}; meses.forEach(m=>{ const n=xnum(xv(row.getCell(m.i))); if(n) mesesPag[m.mes]=Math.round(n*100); });
    const fe=g("entregaPICV"), fd=g("deposito"), ff=g("firma");
    items.push({fila:r,cliente:cli.replace(/\s+/g," "),unidadTxt:un,key:claveUnidad(un),...partirUnidad(un),
      info:{vendedor:xtxt(g("vendedor")),uafe:xtxt(g("uafe")),fechaEntregaPICV:xfecha(fe),fechaDeposito:xfecha(fd),fechaFirmaReserva:xfecha(ff),fechaEntrada:""},
      areas:{areaVendida:xnum(g("areaVendida")),areaDefinitiva:xnum(g("areaDefinitiva")),valorM2:Math.round(xnum(g("valorM2"))*100),plano:xtxt(g("plano")),
        areaBalcon:xnum(g("areaBalcon")),valorM2Balcon:Math.round(xnum(g("vBalcon"))*100),areaPatio:xnum(g("areaPatio")),valorM2Patio:Math.round(xnum(g("vPatio"))*100),areaPlaza:xnum(g("areaPlaza")),valorM2Plaza:Math.round(xnum(g("vPlaza"))*100)},
      nParq:Math.round(xnum(g("nParq"))), pParq:Math.round(xnum(g("pParq"))*100), nBod:Math.round(xnum(g("nBod"))), pBod:Math.round(xnum(g("pBod"))*100),
      total:Math.round(xnum(g("total"))*100), abonado:Math.round(xnum(g("abonado"))*100), mesesPag, bloque:null, avisos:[]});
  }
  // FLUJO: bloques por unidad
  if(wsF){ const hf=filaCabecera(wsF,v=>v.some(x=>norm(x).includes("unidad"))&&v.some(x=>norm(x)==="valor"));
    if(hf){ const fc={}; hf.vals.forEach((x,i)=>{ const h=norm(x); if(h.includes("unidad")) fc.unidad=i; else if(h==="nombre") fc.nombre=i; else if(h==="valor") fc.valor=i; else if(h.includes("pactada")) fc.pactada=i; else if(h.includes("fecha pago")) fc.pago=i; else if(h.includes("recibo")) fc.recibo=i; else if(h.includes("documento")) fc.doc=i; });
      let cur=null; const bloques=[];
      for(let r=hf.r+1;r<=wsF.rowCount;r++){ const row=wsF.getRow(r); const g=k=>fc[k]==null?null:xv(row.getCell(fc[k]));
        const u=xtxt(g("unidad")); const val=Math.round(xnum(g("valor"))*100);
        if(u){ cur={key:claveUnidad(u),nombre:xtxt(g("nombre")),filas:[]}; bloques.push(cur); }
        if(!cur||!val) continue;
        cur.filas.push({fila:r,valor:val,pactada:xfecha(g("pactada")),pago:xfecha(g("pago")),recibo:xtxt(g("recibo")),doc:xtxt(g("doc"))});
      }
      bloques.forEach(b=>{ const it=items.find(i=>i.key===b.key&&!i.bloque); if(it) it.bloque=b; else avisos.push(`FLUJO: la unidad ${b.key} (${b.nombre}) no está en CARTERA; no se importa.`); });
    } else avisos.push("No encontré la fila de títulos en la hoja FLUJO.");
  }
  // RESERVAS: fecha de entrada
  if(wsR){ const hr=filaCabecera(wsR,v=>v.some(x=>norm(x)==="cliente")&&v.some(x=>norm(x).includes("entrada")));
    if(hr){ const rc={}; hr.vals.forEach((x,i)=>{ const h=norm(x); if(h.includes("unidad")) rc.unidad=i; else if(h.includes("fecha entrada")) rc.entrada=i; else if(h.includes("contrato")) rc.contrato=i; });
      for(let r=hr.r+1;r<=wsR.rowCount;r++){ const row=wsR.getRow(r); const u=rc.unidad&&xtxt(xv(row.getCell(rc.unidad))); if(!u) continue; const it=items.find(i=>i.key===claveUnidad(u)); if(!it) continue;
        const fe=xv(row.getCell(rc.entrada)); it.info.fechaEntrada=xfecha(fe)||(/sin entrada/i.test(xtxt(fe))?"SIN ENTRADA":"");
        if(!it.info.fechaFirmaReserva&&rc.contrato) it.info.fechaFirmaReserva=xfecha(xv(row.getCell(rc.contrato))); } } }
  // Construir cuotas y pagos por cada venta
  items.forEach(it=>{
    const sumB=it.bloque?it.bloque.filas.reduce((s,f)=>s+f.valor,0):0;

        if(i-s>=3){ const ini=filas[s].pactada; it.avisos.push(`Fechas pactadas día por día (${fechaCorta(filas[s].pactada)}, ${fechaCorta(filas[s+1].pactada)}…) se tomaron como mensuales.`); for(let k=s;k<i;k++) filas[k].pactada=addMonths(ini,k-s); } } else i++; } }

      let fecha=f.pactada||f.pago; if(!fecha){ fecha=addMonths(lastF,1); if(tipo!=="CREDITO"&&!f._av){ f._av=1; } } lastF=fecha;

      const k=(tipo==="RESERVA"?"R":tipo==="ENTRADA"?"E":"C")+n+(tipo==="CREDITO"?"-"+idx:"");
      cuotas.push({k,tipo,n,fecha,monto:f.valor,pagado:0});

      else { it.avisos.push(`FLUJO suma ${$$(suma)}, más que el VALOR TOTAL ${$$(precio)}; se usó la suma de FLUJO. Revisa este cliente.`); it.precio=precio=suma; it.precioUnidad=Math.max(0,precio-it.pParq-it.pBod); } }

async function guardarCorreccion(){ const m=S.ui.modal, d=m.d, c=byId("comprobantes",String(m.n)); if(!c) return;
  if(!d.fecha){ m.err=["La fecha es obligatoria."]; render(); return; }
  const nv=c.estado==="ANULADO"?c.valor:parseMoney(d.valor);
  if(!(nv>0)){ m.err=["Escribe un valor válido, por ejemplo 1.500,00"]; render(); return; }
  let cambioValor=null;
  if(nv!==c.valor){ const pg=byId("pagos",c.pagoId);
    if(c.ventaId&&pg){ const vs=await S.db.doc("ventas/"+c.ventaId).get(); if(!vs.exists){ m.err=["No se encontró la venta de este comprobante."]; render(); return; }
      const v=vs.data(); const base=v.cuotas.map(q=>{ const a=(pg.aplicaciones||[]).find(x=>x.k===q.k); return a?{...q,pagado:Math.max(0,q.pagado-a.monto)}:q; });
      const r2=imputar(base,nv); if(r2.err){ m.err=[r2.err]; render(); return; }
      cambioValor={cuotas:base.map(q=>{ const a=r2.apps.find(x=>x.k===q.k); return a?{...q,pagado:q.pagado+a.monto}:q; }),apps:r2.apps};
    } else cambioValor={};
  }
  const p=byId("proyectos",c.proyectoId)||{fideicomiso:c.fideicomiso}; const ch=d.forma==="CHEQUE", ref=(d.referencia||"").trim();
  const doc=ch?"":((d.documento||"").trim()&&d.documento!==c.documento?d.documento.trim():(d.forma!==c.forma||ref!==((byId("pagos",c.pagoId)||{}).referencia||"")?documentoTxt(p,d.forma,ref):(d.documento||"").trim()));
  const nuevo={fecha:d.fecha,concepto:(d.concepto||"").trim(),forma:d.forma,documento:doc,cheque:ch?ref:"",banco:(d.banco||"").trim(),efectivo:d.forma==="EFECTIVO"?nv:0,valor:nv,letras:nv!==c.valor?montoLetras(nv):c.letras,saldoDespues:nv!==c.valor?Math.max(0,(c.saldoDespues||0)-(nv-c.valor)):c.saldoDespues,
    cliente:{...c.cliente,nombre:(d.cliNombre||"").trim(),identificacion:(d.cliId||"").trim(),email:(d.cliEmail||"").trim().toLowerCase()},recibe:{nombre:(d.recNombre||"").trim(),ci:(d.recCI||"").trim()}};
  const L={fecha:"fecha",concepto:"concepto",forma:"forma de pago",documento:"documento",cheque:"cheque",banco:"banco"}; const cambios=[];
  if(nv!==c.valor) cambios.push(`valor: ${$$(c.valor)} → ${$$(nv)}`);
  Object.keys(L).forEach(k=>{ if(String(nuevo[k]??"")!==String(c[k]??"")) cambios.push(`${L[k]}: "${c[k]||""}" → "${nuevo[k]||""}"`); });
  if(nuevo.cliente.nombre!==c.cliente?.nombre||nuevo.cliente.identificacion!==(c.cliente?.identificacion||"")||nuevo.cliente.email!==(c.cliente?.email||"")) cambios.push("datos del cliente");
  if(nuevo.recibe.nombre!==(c.recibe?.nombre||"")||nuevo.recibe.ci!==(c.recibe?.ci||"")) cambios.push("recibí conforme");
  if(!cambios.length){ S.ui.modal=null; render(); toast("No hubo cambios."); return; }
  m.saving=true; render(); const y=window.__yo&&window.__yo();
  await S.db.doc("comprobantes/"+c.id).update({...nuevo,ediciones:[...(c.ediciones||[]),{en:new Date().toISOString(),por:(y&&y.nombre)||S.perfil?.nombre||"",cambios:cambios.join("; ")}]});
  if(c.pagoId&&byId("pagos",c.pagoId)) await S.db.doc("pagos/"+c.pagoId).update({fecha:nuevo.fecha,concepto:nuevo.concepto,forma:nuevo.forma,banco:nuevo.banco,referencia:ref,...(cambioValor&&cambioValor.apps?{monto:nv,aplicaciones:cambioValor.apps}:{})});
  if(cambioValor&&cambioValor.cuotas) await S.db.doc("ventas/"+c.ventaId).update({cuotas:cambioValor.cuotas});
  S.ui.modal=null; toast("Comprobante corregido."); render();
}

function esAdmin(){ const y=window.__yo&&window.__yo(); return y?y.rol==="admin":!!S.canEdit; }
function planBorrar(q,id){ // qué se va a borrar
  const r={ventas:[],pagos:[],comprobantes:[],unidades:[],clientes:[],proyectos:[],liberar:[]};
  const conVenta=vids=>{ const s=new Set(vids); r.ventas.push(...S.ventas.filter(v=>s.has(v.id))); r.pagos.push(...S.pagos.filter(p=>s.has(p.ventaId))); r.comprobantes.push(...S.comprobantes.filter(c=>s.has(c.ventaId))); r.liberar.push(...S.unidades.filter(u=>s.has(u.ventaId))); };
  if(q==="todo"){ for(const c of ["ventas","pagos","comprobantes","unidades","clientes","proyectos"]) r[c]=[...S[c]]; return r; }
  if(q==="venta") conVenta([id]);
  if(q==="cliente"){ conVenta(S.ventas.filter(v=>v.clienteId===id).map(v=>v.id)); r.clientes=S.clientes.filter(c=>c.id===id); }
  if(q==="unidad"){ r.unidades=S.unidades.filter(u=>u.id===id); }
  if(q==="proyecto"){ conVenta(S.ventas.filter(v=>v.proyectoId===id).map(v=>v.id)); r.unidades=S.unidades.filter(u=>u.proyectoId===id); r.proyectos=S.proyectos.filter(p=>p.id===id); r.liberar=[];
    const quedan=new Set(S.ventas.filter(v=>v.proyectoId!==id).map(v=>v.clienteId)); const ids=new Set(r.ventas.map(v=>v.clienteId)); r.clientes=S.clientes.filter(c=>ids.has(c.id)&&!quedan.has(c.id)); }
  return r;
}
function modalBorrar(){ const m=S.ui.modal, r=planBorrar(m.q,m.id);
  const titulo={todo:"Borrar todos los datos",venta:"Eliminar venta",cliente:"Eliminar cliente",unidad:"Eliminar unidad",proyecto:"Eliminar proyecto"}[m.q];
  const que=m.q==="proyecto"?esc(byId("proyectos",m.id)?.nombre||""):m.q==="cliente"?esc(cliNombre(byId("clientes",m.id))):m.q==="venta"?esc(cliNombre(byId("clientes",byId("ventas",m.id)?.clienteId))):m.q==="unidad"?esc(unidadTxt(byId("unidades",m.id))):"todo el sistema";
  const li=[[r.proyectos.length,"proyecto(s)"],[r.unidades.length,"unidad(es)"],[r.ventas.length,"venta(s)"],[r.pagos.length,"pago(s)"],[r.comprobantes.length,"comprobante(s)"],[r.clientes.length,"cliente(s)"]].filter(x=>x[0]).map(x=>`<li><b>${x[0]}</b> ${x[1]}</li>`).join("");
  return `<h2>${titulo}</h2><p>Se eliminará <b>${que}</b> junto con:</p><ul>${li||"<li>Solo este registro</li>"}</ul>
  ${r.liberar.length?`<div class="note">${r.liberar.length} unidad(es) volverán a quedar disponibles.</div>`:""}
  ${m.q==="cliente"&&r.ventas.length?`<div class="note a">Este cliente tiene ventas: también se borrarán sus pagos y comprobantes.</div>`:""}
  ${(m.q==="proyecto"||m.q==="todo")&&S.od&&S.od.conectado?`<div class="f"><label>Excel en OneDrive</label>${sel("modal.d.od",[["1","Borrar también su carpeta de OneDrive (queda en la papelera de OneDrive)"],["0","Dejar el Excel en OneDrive"]])}</div>`:""}
  <div class="note r">Esto no se puede deshacer. Para un comprobante real que salió mal, usa mejor <b>Anular</b>.</div>
  <div class="f"><label>Escribe <b>BORRAR</b> para confirmar</label>${inp("modal.d.conf",'autocomplete="off"')}</div>`;

async function confirmBorrar(){ const m=S.ui.modal; if(String(m.d.conf||"").trim().toUpperCase()!=="BORRAR"){ m.err=["Escribe BORRAR para confirmar."]; render(); return; }
  m.err=[]; m.saving=true; render();
  const r=planBorrar(m.q,m.id), del=new Set(r.comprobantes.map(c=>c.id));
  if(m.d.od!=="0"&&window.__od&&window.__od.borrar&&S.od&&S.od.conectado){ for(const p of r.proyectos){ try{ await window.__od.borrar(p.id,p.nombre); }catch(e){} } }
  const borradas=new Set(r.unidades.map(u=>u.id));
  for(const u of r.liberar) if(!borradas.has(u.id)) await S.db.doc("unidades/"+u.id).update({estado:"DISPONIBLE",ventaId:null,asignadoA:null});
  for(const u of S.unidades.filter(u=>u.asignadoA&&borradas.has(u.asignadoA)&&!borradas.has(u.id))) await S.db.doc("unidades/"+u.id).update({asignadoA:null});
  for(const c of ["comprobantes","pagos","ventas","unidades","clientes","proyectos"]) for(const x of r[c]) await S.db.doc(`${c}/${x.id}`).delete();
  if(!S.comprobantes.some(c=>!del.has(c.id))) await S.db.doc("cfg/contador").set({siguiente:Number(S.cfg.numeroInicial)||6233});
  const q=m.q; S.ui.modal=null; S.ui.odC=null;
  if(q==="proyecto"||q==="todo") S.ui.proy=null; if(q==="venta"||q==="cliente"||q==="todo") S.ui.venta={};
  toast(q==="todo"?"Se borraron todos los datos.":"Eliminado."); render();
}

    let k=0; const t=setInterval(async()=>{ k++; await cargarOD(); if((S.od&&S.od.conectado&&S.od.cuenta)||k>60){ clearInterval(t); if(S.od&&S.od.conectado){ S.odUrl=null; sincronizarOD(true); } } },5000); }catch(e){ toast("Error: "+e.message); } },
  odAhora:()=>sincronizarOD(true),
  odGuardarNombres:async()=>{ const d=S.ui.odC||{}; try{ for(const p of S.proyectos){ const n=String((d.n||{})[p.id]||"").trim().replace(/\.xlsx$/i,""); if(n&&n!==(p.archivoOneDrive||p.nombre)) await S.db.doc("proyectos/"+p.id).update({archivoOneDrive:n}); } S.od=await window.__od.config({carpeta:d.carpeta||"",reiniciar:true,claves:Object.fromEntries(Object.entries(d.k||{}).filter(([k])=>k==="*"||S.proyectos.some(p=>p.id===k)))}); sincronizarOD._h={}; S.ui.odC=null; toast("Guardado. El Excel se subirá con el nuevo nombre en unos segundos.",6000); setTimeout(()=>sincronizarOD(true),2000); }catch(e){ toast("Error: "+(e.message||e.code)); } render(); },
  guardarUsuario:async()=>{ const d=S.ui.usr.d; try{ await window.__api("/api/usuarios",{method:"POST",body:d}); S.ui.usr={d:{rol:"usuario"}}; toast("Usuario guardado."); }catch(e){ toast(e.message); } render(); },
  borrarUsuario:async(d)=>{ try{ await window.__api("/api/usuarios",{method:"DELETE",body:{usuario:d.u}}); S.ui.usr={d:{rol:"usuario"}}; toast("Usuario quitado."); }catch(e){ toast(e.message); } render(); },
  cambiarClave:async()=>{ const c=S.ui.usr.c||{}; try{ await window.__api("/api/clave",{method:"POST",body:c}); S.ui.usr.c={}; toast("Contraseña cambiada."); }catch(e){ toast(e.message); } render(); },
  cerrarModal:()=>{ S.ui.modal=null; render(); },
  cerrarModalBg:(d,t,e)=>{ if(e.target===t){ S.ui.modal=null; render(); } },
};
document.addEventListener("click",e=>{ const t=e.target.closest("[data-act]"); if(!t||t.tagName==="INPUT") return; if(t.disabled) return; const f=A[t.dataset.act]; if(f) f(t.dataset,t,e); });
function onField(e){
  const t=e.target; if(t.dataset.actChange==="logo"){ cargarLogo(t.files[0]); return; }
  if(t.dataset.actChange==="importar"){ leerArchivoImport(t.files[0]); return; }
  if(t.dataset.actChange==="restaurar"){ restaurar(t.files[0]); return; }
  const p=t.dataset.f; if(!p) return;
  const v= t.type==="checkbox"? (t.checked?"1":"0") : t.value;
  setPath(S.ui,p,v);
  // inicializaciones dependientes
  if(p==="venta.n.proyectoId"){ const pr=byId("proyectos",v); if(pr){ Object.assign(S.ui.venta.n,{pctReserva:String(pr.pctReserva),pctEntrada:String(pr.pctEntrada),meses:String(pr.meses),unidadId:"",extras:{},precios:{}}); } render(); return; }
  if(p==="venta.n.unidadId"){ const u=byId("unidades",v); if(u) setPath(S.ui,"venta.n.precios."+u.id,money2in(u.precio)); render(); return; }
  if(p.startsWith("venta.n.extras.")){ const id=p.split(".").pop(); const u=byId("unidades",id); if(u&&!getPath(S.ui,"venta.n.precios."+id)) setPath(S.ui,"venta.n.precios."+id,money2in(u.precio)); render(); return; }
  if(S.ui.modal&&(S.ui.modal.type==="unidad"||S.ui.modal.type==="unidades")&&p.startsWith("modal.d.")&&t.tagName!=="SELECT"){ updCalcPrev(); return; }
  if(S.view==="ventas"&&S.ui.venta.nueva&&p.startsWith("venta.n.")&&t.tagName!=="SELECT"){ updVentaPreview(); return; }
  if(S.view==="caja"&&p.startsWith("caja.")&&p!=="caja.q"&&p!=="caja.forma"){ updCajaPreview(); return; }
  if(p.startsWith("smtpD.")||(p.startsWith("usr.")&&t.tagName!=="SELECT")||p==="perfilD.nombre"||p==="perfilD.ci"||(p.startsWith("cfgD.")&&t.tagName!=="SELECT")||(p.startsWith("modal.")&&p!=="modal.d.base"&&t.tagName!=="SELECT"&&t.type!=="checkbox")) return;
  render();
}
document.addEventListener("input",e=>{ if(e.target.tagName!=="SELECT"&&e.target.type!=="checkbox"&&e.target.type!=="file") onField(e); });
document.addEventListener("change",e=>{ if(e.target.tagName==="SELECT"||e.target.type==="checkbox"||e.target.type==="file"||e.target.type==="date") onField(e); });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)&&h!==S.view){ S.view=h; render(); } });
// perfil editable inicial
Object.defineProperty(S.ui,"perfilD",{get(){ return this._pd || (this._pd={...(S.perfil||{})}); }, set(v){ this._pd=v; }, enumerable:true, configurable:true});
boot();
</script>
